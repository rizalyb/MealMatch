<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            font-family: sans-serif;
        }

        .photo-viewer {
            width: 100%;
            height: 220px;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            background: transparent;
        }

        .photo-viewer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .photo-control {
            position: absolute;
            border: none;
            color: white;
            background: rgba(0, 0, 0, 0.62);
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease, background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .photo-viewer:hover .photo-control {
            opacity: 1;
        }

        .photo-control:hover {
            background: rgba(0, 0, 0, 0.88);
        }

        .photo-arrow {
            top: 50%;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 28px;
            line-height: 1;
        }

        .photo-arrow.left {
            left: 10px;
        }

        .photo-arrow.right {
            right: 10px;
        }

        .photo-arrow.hidden {
            display: none;
        }

        .expand-photo {
            right: 10px;
            bottom: 10px;
            width: 34px;
            height: 34px;
            border-radius: 7px;
            font-size: 20px;
            line-height: 1;
        }

        @media (hover: none) {
            .photo-control {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="photo-viewer" id="photo-viewer">

        <img id="recipe-photo" src="" alt="Recipe photo">

        <button
            class="photo-control photo-arrow left"
            id="previous-photo"
            type="button"
            aria-label="Previous photo">
            &#8249;
        </button>

        <button
            class="photo-control photo-arrow right"
            id="next-photo"
            type="button"
            aria-label="Next photo">
            &#8250;
        </button>

        <button
            class="photo-control expand-photo"
            id="expand-photo"
            type="button"
            aria-label="Enlarge photo"
            title="Enlarge photo">
            ⛶
        </button>

    </div>

    <script>
        let images = [];
        let currentIndex = 0;
        let clickCounter = 0;

        const photo = document.getElementById("recipe-photo");
        const previousButton = document.getElementById("previous-photo");
        const nextButton = document.getElementById("next-photo");
        const expandButton = document.getElementById("expand-photo");
        const viewer = document.getElementById("photo-viewer");

        function sendToStreamlit(type, extra = {}) {
            window.parent.postMessage(
                {
                    isStreamlitMessage: true,
                    type: type,
                    ...extra
                },
                "*"
            );
        }

        function setFrameHeight(height) {
            sendToStreamlit("streamlit:setFrameHeight", {
                height: height
            });
        }

        function setComponentValue(value) {
            sendToStreamlit("streamlit:setComponentValue", {
                value: value
            });
        }

        function displayPhoto() {

            if (!images.length) {
                photo.removeAttribute("src");
                return;
            }

            photo.src = images[currentIndex];

            const hideArrows = images.length <= 1;

            previousButton.classList.toggle(
                "hidden",
                hideArrows
            );

            nextButton.classList.toggle(
                "hidden",
                hideArrows
            );
        }

        function changePhoto(direction) {

            if (images.length <= 1) {
                return;
            }

            currentIndex =
                (currentIndex + direction + images.length)
                % images.length;

            displayPhoto();
        }

        previousButton.addEventListener("click", function(event) {
            event.stopPropagation();
            changePhoto(-1);
        });

        nextButton.addEventListener("click", function(event) {
            event.stopPropagation();
            changePhoto(1);
        });

        expandButton.addEventListener("click", function(event) {

            event.stopPropagation();

            clickCounter += 1;

            const clickId =
                Date.now().toString() + "-" + clickCounter.toString();

            setComponentValue({
                action: "expand",
                click_id: clickId
            });
        });

        function render(args) {

            images = Array.isArray(args.images) ? args.images : [];

            viewer.style.height =
                (Number(args.viewer_height) || 220) + "px";

            expandButton.style.display =
                args.show_expand === false ? "none" : "flex";

            if (currentIndex >= images.length) {
                currentIndex = 0;
            }

            displayPhoto();

            setFrameHeight(
                Number(args.viewer_height) || 220
            );
        }

        window.addEventListener("message", function(event) {

            const message = event.data;

            if (
                message &&
                message.type === "streamlit:render" &&
                message.args
            ) {
                render(message.args);
            }
        });

        sendToStreamlit("streamlit:componentReady", {
            apiVersion: 1
        });

        setFrameHeight(220);
    </script>

</body>
</html>
